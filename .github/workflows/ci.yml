name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux (build + platform-independent tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Fetch restic (Linux test binary, verified)
        run: python3 tools/fetch_restic.py --linux
      - name: Build (warnings as errors)
        run: dotnet build BackupForge.slnx -c Release
      - name: Test
        env:
          BF_REQUIRE_RESTIC: "1"
        run: dotnet test BackupForge.slnx -c Release --no-build --logger "trx" --results-directory TestResults --blame-hang-timeout 6m
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore
      - name: Test summary (failures, skips — only "Windows only" skips allowed)
        if: always()
        run: >-
          python3 tools/trx_summary.py TestResults --title "Linux tests"
          --allow-skip-reason "Windows only"
          --report BackupForge.Integration.Tests.SqlLocalDbTests.Sql_backup_verify_checkdb_then_restic_chain

  windows:
    name: Windows (build + all tests + integration)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Fetch restic (pinned, verified)
        id: restic
        shell: pwsh
        run: python tools/fetch_restic.py
      - name: SQL Server LocalDB (required by the SQL integration test, BF_REQUIRE_LOCALDB)
        id: localdb
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb -y --no-progress | Out-Null
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
            $bin = Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($bin) { $env:PATH = $bin.DirectoryName + ';' + $env:PATH; $bin.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
          }
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Build (warnings as errors)
        run: dotnet build BackupForge.slnx -c Release
      - name: Test
        shell: pwsh
        env:
          BF_REQUIRE_RESTIC: "1"
          BF_REQUIRE_LOCALDB: "1"
        run: dotnet test BackupForge.slnx -c Release --no-build --logger "trx" --results-directory TestResults --blame-hang-timeout 6m
      - name: Test summary (0 skipped tests outside tests/ci-allowed-skips.txt)
        if: always()
        shell: pwsh
        run: python tools/trx_summary.py TestResults --title "Windows tests" --allowed-skips tests/ci-allowed-skips.txt --report BackupForge.Integration.Tests.SqlLocalDbTests.Sql_backup_verify_checkdb_then_restic_chain
      - name: VSS diagnostics with writers (informational, CR-002 A1)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          & src/BackupForge.Cli/bin/Release/net10.0/bf.exe diag vss "$env:RUNNER_TEMP"
          "exit code: $LASTEXITCODE"
      - name: Publish (win-x64, self-contained, one shared folder)
        shell: pwsh
        run: ./installer/publish.ps1 -Out artifacts/publish
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=0.1.0.$env:GITHUB_RUN_NUMBER" installer/BackupForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer/Output/*.exe | ForEach-Object { "installer: $($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }
      - name: Old-layout installer (single-file, for the upgrade test)
        shell: pwsh
        run: |
          ./installer/publish.ps1 -Out artifacts/publish-single -SingleFile
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=0.0.9.$env:GITHUB_RUN_NUMBER" /DSingleFile "/DPublishDir=..\artifacts\publish-single" "/O$PWD\installer\OldOutput" installer/BackupForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer/OldOutput/*.exe | ForEach-Object { "old-layout installer: $($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }
      - name: Installer smoke test (old layout → upgrade → service → bf → uninstall)
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Setup (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName -OldSetup (Get-ChildItem installer/OldOutput/*.exe | Select-Object -First 1).FullName
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: installer
          path: installer/Output/*.exe
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore
