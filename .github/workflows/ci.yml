name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux (build + platform-independent tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Fetch restic (Linux test binary, verified)
        run: python3 tools/fetch_restic.py --linux
      - name: Build (warnings as errors)
        run: dotnet build BackupForge.slnx -c Release
      - name: Test
        env:
          BF_REQUIRE_RESTIC: "1"
        run: dotnet test BackupForge.slnx -c Release --no-build --logger "trx" --results-directory TestResults --blame-hang-timeout 6m
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore
      - name: Failed tests (summary)
        if: always()
        run: python3 tools/trx_summary.py TestResults

  windows:
    name: Windows (build + all tests + integration)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Fetch restic (pinned, verified)
        id: restic
        shell: pwsh
        run: python tools/fetch_restic.py
      - name: SQL Server LocalDB (for the SQL integration tests)
        id: localdb
        continue-on-error: true
        shell: pwsh
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Build (warnings as errors)
        run: dotnet build BackupForge.slnx -c Release
      - name: Test
        shell: pwsh
        env:
          BF_REQUIRE_RESTIC: "1"
        run: dotnet test BackupForge.slnx -c Release --no-build --logger "trx" --results-directory TestResults --blame-hang-timeout 6m
      - name: Publish (win-x64, self-contained, single-file)
        shell: pwsh
        run: |
          $common = @('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:DebugType=none')
          dotnet publish src/BackupForge.Service @common -o artifacts/publish/service
          dotnet publish src/BackupForge.Cli @common -o artifacts/publish/cli
          dotnet publish src/BackupForge.Gui @common -o artifacts/publish/gui
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=0.1.0.$env:GITHUB_RUN_NUMBER" installer/BackupForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer smoke test (silent install → service → bf → uninstall)
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Setup (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: installer
          path: installer/Output/*.exe
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore
      - name: Failed tests (summary)
        if: always()
        shell: pwsh
        run: python tools/trx_summary.py TestResults
