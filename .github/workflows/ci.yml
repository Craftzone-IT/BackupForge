name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux (build + platform-independent tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build (warnings as errors)
        run: dotnet build BackupForge.slnx -c Release
      - name: Test
        run: dotnet test BackupForge.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore

  windows:
    name: Windows (build + all tests + integration)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Fetch restic (pinned, verified)
        id: restic
        shell: pwsh
        run: python tools/fetch_restic.py
      - name: Build (warnings as errors)
        run: dotnet build BackupForge.slnx -c Release
      - name: Test
        shell: pwsh
        run: dotnet test BackupForge.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore
